[package]
name = "etop"
version = "0.1.0"
edition = "2021"
description = "Deterministic macOS Developer Ecosystem & Package Top"
authors = ["Vikks"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tabled = { version = "0.15", features = ["ansi"] }
colored = "2.1"
anyhow = "1.0"
thiserror = "1.0"
rayon = "1.10"
jwalk = "0.8"
ratatui = "0.30.2"
crossterm = "0.29.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
